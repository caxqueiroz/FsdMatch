name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: lint
        run: golangci-lint run ./...
      - name: test
        # Race detector requires CGO; tree-sitter does too. Default
        # CGO_ENABLED=1 on the Linux runner.
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o bin/fsdtrace ./cmd/fsdtrace
