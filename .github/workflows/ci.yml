name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...
      - name: test
        # Race detector requires CGO; tree-sitter does too. Default
        # CGO_ENABLED=1 on the Linux runner.
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o bin/fsdtrace ./cmd/fsdtrace
